server {
    listen 80;
    # ============================================================
    # GANTI dengan domain Anda!
    # Contoh: server_name koperasimajakara.com www.koperasimajakara.com;
    # ============================================================
    server_name majakara.cloud www.majakara.cloud;

    root /var/www/html/public;
    index index.php;

    # ---- Let's Encrypt challenge (untuk certbot) ----
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- Redirect HTTP ke HTTPS (aktifkan setelah SSL siap) ----
    # Uncomment blok ini setelah Let's Encrypt berhasil:
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # ---- Sementara (sebelum SSL): forward langsung ke PHP ----
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- PHP-FPM ----
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ---- Static assets dengan cache ----
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Upload size (untuk foto KTP, selfie) ----
    client_max_body_size 25M;

    # ---- Security headers ----
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ---- Block akses ke file sensitif ----
    location ~ /\. {
        deny all;
    }
    location ~ /(storage|bootstrap|vendor|config|database|routes|tests) {
        deny all;
    }

    # ---- Gzip compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ---- Logging ----
    access_log /var/log/nginx/koperasi_access.log;
    error_log  /var/log/nginx/koperasi_error.log;
}

