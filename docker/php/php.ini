; ============================================================
; PHP Production Settings — Koperasi Majakara
; ============================================================

[PHP]
; Error handling — production: off display, on log
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php_errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Memory
memory_limit = 256M

; Execution time (Tesseract OCR bisa lama)
max_execution_time = 120
max_input_time = 120

; Upload (foto KTP, selfie, dokumen)
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 10

; Date
date.timezone = Asia/Jakarta

; Session
session.gc_maxlifetime = 7200
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1

; Output
output_buffering = 4096
zlib.output_compression = On

; ============================================================
; OPcache — Caching bytecode PHP
; ============================================================
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 0
