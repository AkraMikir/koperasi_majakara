; ============================================================
; PHP-FPM Pool Configuration — Koperasi Majakara
; ============================================================

[www]
; User & group
user = www-data
group = www-data

; Socket — TCP (untuk komunikasi dengan Nginx di container lain)
listen = 0.0.0.0:9000

; Process manager — dynamic untuk VPS dengan RAM terbatas
pm = dynamic

; Jumlah worker — sesuaikan dengan RAM VPS Anda:
; VPS 2GB RAM: pm.max_children = 10
; VPS 4GB RAM: pm.max_children = 20
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; Restart worker setelah N requests (mencegah memory leak)
pm.max_requests = 500

; Timeout
request_terminate_timeout = 120

; Logging
access.log = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Env variables
clear_env = no

; Status page (opsional, untuk monitoring)
pm.status_path = /fpm-status
ping.path = /fpm-ping
