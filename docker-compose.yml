services:
  # ============================================================
  # NGINX — Web Server
  # ============================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: koperasi_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
      # Let's Encrypt SSL certificates (diisi setelah certbot)
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - koperasi_net
    restart: unless-stopped

  # ============================================================
  # APP — PHP 8.2-FPM (Laravel)
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: koperasi_app
    env_file:
      - .env
    volumes:
      # Storage persistent (uploads, logs, dll)
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - koperasi_net
    restart: unless-stopped

  # ============================================================
  # QUEUE WORKER — Laravel Queue
  # ============================================================
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: koperasi_queue
    env_file:
      - .env
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - koperasi_net
    restart: unless-stopped

  # ============================================================
  # MYSQL 8.0 — Database
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: koperasi_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-koperasi_majakara}
      MYSQL_USER: ${DB_USERNAME:-koperasi_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-koperasi_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - koperasi_net
    restart: unless-stopped

  # ============================================================
  # REDIS 7 — Cache & Queue Backend
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: koperasi_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - koperasi_net
    restart: unless-stopped

  # ============================================================
  # CERTBOT — Let's Encrypt SSL (jalankan sekali, lalu disable)
  # ============================================================
  certbot:
    image: certbot/certbot:latest
    container_name: koperasi_certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Jalankan manual: docker compose run --rm certbot certonly ...
    profiles:
      - ssl
    networks:
      - koperasi_net

# ============================================================
# VOLUMES
# ============================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local
  app_bootstrap_cache:
    driver: local
  certbot_webroot:
    driver: local
  certbot_certs:
    driver: local

# ============================================================
# NETWORKS
# ============================================================
networks:
  koperasi_net:
    driver: bridge
